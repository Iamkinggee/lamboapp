# LOCATION: .github/workflows/deploy.yml
# OCI deployment — SSH into both VMs and pull latest code

name: Deploy to OCI

on:
  push:
    branches: [main]

jobs:
  deploy-signal-engine:
    name: Deploy Signal Engine (OCI VM1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH deploy to VM1
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.OCI_VM1_IP }}
          username: ubuntu
          key:      ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/lamboapp
            git pull origin main
            cd services/signal-engine
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            sudo systemctl restart smc-engine
            echo "Signal engine restarted"

  deploy-api-server:
    name: Deploy API Server (OCI VM2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH deploy to VM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.OCI_VM2_IP }}
          username: ubuntu
          key:      ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/lamboapp
            git pull origin main
            cd services/api-server
            npm install --silent
            npm run build
            pm2 restart smc-api || pm2 start dist/index.js --name smc-api
            echo "API server restarted"

  deploy-ai-assistant:
    name: Deploy AI Assistant (OCI VM1)
    runs-on: ubuntu-latest
    needs: deploy-signal-engine
    steps:
      - uses: actions/checkout@v4

      - name: SSH deploy AI service to VM1
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.OCI_VM1_IP }}
          username: ubuntu
          key:      ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/lamboapp
            git pull origin main
            cd services/ai-assistant
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            sudo systemctl restart smc-ai
            echo "AI assistant restarted"
