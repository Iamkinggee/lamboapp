# FILE: infra/aws/docker-compose.aws.yml
# Production docker-compose for AWS EC2.
# Images pulled from ECR. Env vars from .env file on the instance.
# Run: docker-compose -f docker-compose.aws.yml up -d

version: "3.9"

x-ecr: &ecr-base
  ${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com

services:

  signal-engine:
    image: "${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/lamboapp/signal-engine:latest"
    container_name: smc-signal-engine
    restart: always
    env_file: .env
    logging:
      driver: awslogs
      options:
        awslogs-region:       "${REGION}"
        awslogs-group:        "/lamboapp/signal-engine"
        awslogs-create-group: "true"
    networks:
      - smc-net

  api-server:
    image: "${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/lamboapp/api-server:latest"
    container_name: smc-api-server
    restart: always
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - AI_SERVICE_URL=http://ai-assistant:8000
    logging:
      driver: awslogs
      options:
        awslogs-region:       "${REGION}"
        awslogs-group:        "/lamboapp/api-server"
        awslogs-create-group: "true"
    networks:
      - smc-net

  ai-assistant:
    image: "${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/lamboapp/ai-assistant:latest"
    container_name: smc-ai-assistant
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    logging:
      driver: awslogs
      options:
        awslogs-region:       "${REGION}"
        awslogs-group:        "/lamboapp/ai-assistant"
        awslogs-create-group: "true"
    networks:
      - smc-net

networks:
  smc-net:
    driver: bridge